# ===================================================================
#  ここを書き換えるだけで、サイト全体の表示が変わります
# ===================================================================

title: "金魚鉢"                 # ← お店の名前
tagline: "大正・昭和のきものを、いまの人へ"  # ← 一行のキャッチコピー
latin_name: "KINGYOBACHI"       # ← 見出しに小さく入る欧文表記
description: "アンティーク・リユースのきもののオンラインショップ。大正から昭和のきものを、寸法と状態を明記して一点ずつ。"

# --- 店の情報 ---------------------------------------------------
shop:
  tel: "080-5456-8686"
  hours: "10:00 – 18:00"
  hours_note: "この時間にお電話・ご連絡をいただければお答えします"
  mail: ""              # 連絡用のメールアドレス（使うなら書く）
  shop_url: "https://jp.mercari.com/user/profile/478554697"   # 出品一覧のURL
  shop_name: "メルカリ"   # 購入ボタンに出る名前
  soryo: "送料込み（出品ごとの表示をご確認ください）"
  furikomi: "メルカリのお支払い方法によります"
  hasso: "ご購入から1〜2日以内に発送します"
  henpin: "メルカリの取引ルールに準じます。届いたものが説明と違う場合は、評価前にご連絡ください"

# --- SNS（使わない項目は "" のままで大丈夫です）-----------------
social:
  instagram: ""   # 例: kingyobachi_kimono
  x: ""

# ===================================================================
#  ここから下は基本的に触らなくて大丈夫です
# ===================================================================

url: ""
baseurl: "/kingyobachi"   # リポジトリ名が kingyobachi のため。名前を変えたらここも直す

permalink: /blog/:year/:month/:day/:title/

collections:
  kimono:
    output: true
    permalink: /kimono/:name/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "kimono"
    values:
      layout: "kimono"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
