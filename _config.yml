# ===================================================================
#  ここを書き換えるだけで、サイト全体の表示が変わります
# ===================================================================

title: "金魚鉢"                 # ← お店の名前
tagline: "大正・昭和のきものを、いまの人へ"  # ← 一行のキャッチコピー
latin_name: "KINGYOBACHI"       # ← 見出しに小さく入る欧文表記
description: "アンティーク・リユースのきもののオンラインショップ。大正から昭和のきものを、寸法と状態を明記して一点ずつ。"

# --- 店の情報 ---------------------------------------------------
shop:
  tel: "080-5456-8686"
  hours: "10:00 – 18:00"
  hours_note: "この時間にお電話・ご連絡をいただければお答えします"
  mail: ""              # 連絡用のメールアドレス（使うなら書く）
  shop_url: ""          # 実際に買えるお店のURL（BASE・minne など）
  shop_name: ""         # そのお店の名前（例: BASE）
  soryo: "全国一律 900円（レターパックプラス）"
  furikomi: "ゆうちょ銀行／PayPay（ご注文後にお伝えします）"
  hasso: "ご入金の確認から2〜3日以内"
  henpin: "到着後7日以内であれば、理由を問わず返品を承ります（送料はご負担ください）"

# --- SNS（使わない項目は "" のままで大丈夫です）-----------------
social:
  instagram: ""   # 例: kingyobachi_kimono
  x: ""

# ===================================================================
#  ここから下は基本的に触らなくて大丈夫です
# ===================================================================

url: ""
baseurl: "/kingyobachi"   # リポジトリ名が kingyobachi のため。名前を変えたらここも直す

permalink: /blog/:year/:month/:day/:title/

collections:
  kimono:
    output: true
    permalink: /kimono/:name/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "kimono"
    values:
      layout: "kimono"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
