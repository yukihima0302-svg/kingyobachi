# 反物・商品のギャラリー
#
# 1品につき下のかたまりを1つ足してください。
#   name    … 品名
#   kind    … 種別（小紋・紬・銘仙 など）
#   note    … 一行の説明
#   price   … 価格の表示（空にすると「お問い合わせください」になります）
#   image   … assets/img/ に置いた写真のファイル名。空だと文様の柄が代わりに出ます
#   pattern … 写真がないときに使う柄。yagasuri / kikko / seigaiha / asanoha / ichimatsu
#   tone    … 柄の色。fuji / asagi / kobai / kogane

