# 着物のギャラリー
#
# 1点につき下のかたまりを1つ足してください。すべて一点物です。
#   name    … 品名
#   kind    … 種別（銘仙・小紋・紬・羽織 など）
#   era     … 時代（大正末〜昭和初期 など。分からなければ空に）
#   shitake … 身丈（cm）
#   yuki    … 裄（cm）
#   jotai   … 状態。ここは正直に書くほど信用されます
#   note    … 一行の説明
#   price   … 空にすると「お問い合わせください」になります
#   image   … assets/img/ に置いた写真のファイル名。空だと文様の柄が代わりに出ます
#   pattern … 写真がないときの柄。yagasuri / kikko / seigaiha / asanoha / ichimatsu
#   tone    … 柄の色。fuji / asagi / kobai / kogane

